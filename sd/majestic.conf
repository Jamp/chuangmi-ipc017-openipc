# Con H.264 4096 kbps VBR y GOP de 1 s, un I-frame que no cabe en el anillo del
# VENC ("v-w[h4] full") acaba bloqueando a majestic. Así no se produce.
.video0.bitrate 2048
.video0.rcMode cbr
.video0.gopSize 2

# Modo noche, con los pines medidos en esta placa. IR-cut en el conector IRCUT: majestic
# pulsa irCutPin1 al pasar a noche (el 78 saca el filtro) e irCutPin2 al volver a día
# (el 79 lo pone). LED IR en el pad 52, el del PWM0 en el device tree de fábrica. Sin
# sensor de luz, majestic decide por la ganancia del ISP: a oscuras y con el filtro
# puesto llega a 64x; con el LED encendido y el filtro fuera baja a ~8x.
.nightMode.irCutPin1 78
.nightMode.irCutPin2 79
.nightMode.backlightPin 52
.nightMode.lightMonitor true
.nightMode.autoNightGain 8
